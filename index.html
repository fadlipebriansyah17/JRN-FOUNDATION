<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="JRN Foundation — menjaga alam, memberdayakan masyarakat, dan melestarikan warisan Nusantara.">
<title>JRN Foundation — Jaga Raya Nusantara</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --teal:       #0A2E28;
  --teal-mid:   #143D35;
  --teal-soft:  #1E5447;
  --green:      #3D7A5E;
  --green-pale: #C6DDD3;
  --sand:       #E8DEC8;
  --sand-pale:  #F5F0E6;
  --warm-white: #F9F7F2;
  --ink:        #1A1A18;
  --muted:      #6B7570;
  --serif:      "Cormorant Garamond", Georgia, serif;
  --sans:       "Inter", system-ui, sans-serif;
  --max:        1280px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; font-size: 16px; }

body {
  background: var(--warm-white);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }

.wrap {
  width: min(var(--max), calc(100% - 64px));
  margin-inline: auto;
}

/* ── NAVIGATION ── */

.nav-bar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 100;
  padding: 0;
  transition: background .35s, backdrop-filter .35s;
}

.nav-bar.scrolled {
  background: rgba(10,46,40,.92);
  backdrop-filter: blur(12px);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 68px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: #fff;
}

.brand-symbol {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  color: var(--sand);
  line-height: 1;
}

.brand-name {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: .08em;
  color: #fff;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.nav-links a {
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,.82);
  letter-spacing: .04em;
  transition: color .2s;
}

.nav-links a:hover { color: var(--sand); }

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 2px;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  letter-spacing: .06em;
  transition: background .2s, border-color .2s;
}

.nav-btn:hover {
  background: var(--green);
  border-color: var(--green);
}

.hamburger {
  display: none;
  background: none;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 2px;
  padding: 8px 10px;
  cursor: pointer;
  color: #fff;
  font-size: 18px;
  line-height: 1;
}

/* ── HERO ── */

.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  grid-template-rows: 1fr auto;
  color: #fff;
  background: var(--teal);
  isolation: isolate;
  overflow: hidden;
}

.hero-img {
  position: absolute;
  inset: 0;
  z-index: -2;
}

.hero-img img {
  object-position: center 35%;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(105deg, rgba(5,24,20,.88) 0%, rgba(5,24,20,.45) 55%, rgba(5,24,20,.12) 100%),
    linear-gradient(0deg, rgba(5,24,20,.55) 0%, transparent 45%);
}

.hero-body {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 80px;
  padding-top: 140px;
}

.hero-kicker {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.hero-kicker-line {
  width: 40px;
  height: 1px;
  background: var(--sand);
  opacity: .7;
}

.hero-kicker span {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .18em;
  color: var(--sand);
  opacity: .9;
  text-transform: uppercase;
}

.hero h1 {
  font-family: var(--serif);
  font-size: clamp(52px, 7vw, 100px);
  font-weight: 300;
  line-height: .95;
  letter-spacing: -.02em;
  max-width: 820px;
  margin-bottom: 28px;
}

.hero h1 em {
  font-style: italic;
  color: var(--sand);
}

.hero-sub {
  max-width: 440px;
  font-size: 14px;
  line-height: 1.7;
  color: rgba(255,255,255,.78);
  margin-bottom: 36px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  background: var(--green);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .06em;
  border-radius: 2px;
  transition: background .2s, transform .2s;
}

.btn-primary:hover { background: var(--teal-soft); transform: translateY(-2px); }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  border: 1px solid rgba(255,255,255,.4);
  color: rgba(255,255,255,.9);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .06em;
  border-radius: 2px;
  transition: border-color .2s, color .2s;
}

.btn-ghost:hover { border-color: var(--sand); color: var(--sand); }

.hero-foot {
  padding: 18px 0;
  border-top: 1px solid rgba(255,255,255,.15);
}

.hero-stats {
  display: flex;
  gap: 48px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-num {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  color: var(--sand);
  line-height: 1;
}

.stat-label {
  font-size: 10px;
  letter-spacing: .1em;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
}

/* ── SECTION LABELS ── */

.section-marker {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 48px;
}

.marker-num {
  font-family: var(--serif);
  font-size: 64px;
  font-weight: 300;
  line-height: 1;
  color: var(--green-pale);
  letter-spacing: -.03em;
}

.marker-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.marker-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--green);
}

.marker-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--teal);
  line-height: 1.1;
}

/* ── TENTANG ── */

.about-section {
  padding: 96px 0 80px;
  background: var(--warm-white);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 72px;
  align-items: start;
}

.about-left h2 {
  font-family: var(--serif);
  font-size: clamp(32px, 3.5vw, 52px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -.02em;
  color: var(--teal);
  margin-bottom: 24px;
}

.about-left h2 em {
  font-style: italic;
  color: var(--green);
}

.about-left p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 480px;
  margin-bottom: 16px;
}

.about-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  padding: 12px 24px;
  background: var(--teal);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .05em;
  border-radius: 2px;
  transition: background .2s;
}

.about-cta:hover { background: var(--green); }

.about-photo {
  position: relative;
}

.about-photo-main {
  width: 100%;
  height: 460px;
  border-radius: 3px;
  overflow: hidden;
}

.about-photo-accent {
  position: absolute;
  bottom: -28px;
  left: -28px;
  width: 200px;
  height: 160px;
  border-radius: 2px;
  overflow: hidden;
  border: 4px solid var(--warm-white);
}

.about-badge {
  position: absolute;
  top: 24px;
  right: -20px;
  background: var(--green);
  color: #fff;
  padding: 16px 20px;
  border-radius: 2px;
  text-align: center;
}

.about-badge-num {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 300;
  line-height: 1;
  display: block;
}

.about-badge-text {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  opacity: .85;
  display: block;
  margin-top: 4px;
}

/* ── PILAR ── */

.pillars-section {
  padding: 80px 0;
  background: var(--teal);
  color: #fff;
}

.pillars-section .section-marker .marker-num { color: rgba(255,255,255,.15); }
.pillars-section .section-marker .marker-label { color: var(--sand); }
.pillars-section .section-marker .marker-title { color: #fff; }

.pillars-intro {
  max-width: 560px;
  margin-bottom: 56px;
}

.pillars-intro p {
  font-size: 14px;
  line-height: 1.75;
  color: rgba(255,255,255,.65);
}

.pillar-list {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.1);
}

.pillar-item {
  background: var(--teal);
  padding: 36px 28px;
  transition: background .3s;
  cursor: default;
}

.pillar-item:hover { background: var(--teal-mid); }

.pillar-num {
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .15em;
  color: var(--sand);
  opacity: .7;
  margin-bottom: 28px;
  display: block;
}

.pillar-icon {
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 20px;
}

.pillar-item h3 {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  line-height: 1.2;
  margin-bottom: 12px;
  color: #fff;
}

.pillar-item p {
  font-size: 12px;
  line-height: 1.7;
  color: rgba(255,255,255,.55);
}

/* ── QUOTE BAND ── */

.quote-band {
  padding: 72px 0;
  background: var(--sand);
}

.quote-inner {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: 64px;
  align-items: center;
}

blockquote {
  font-family: var(--serif);
  font-size: clamp(26px, 3vw, 40px);
  font-weight: 300;
  font-style: italic;
  line-height: 1.3;
  color: var(--teal);
  letter-spacing: -.01em;
}

blockquote cite {
  display: block;
  margin-top: 20px;
  font-size: 12px;
  font-style: normal;
  font-family: var(--sans);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--green);
}

.quote-visual {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.qv-row {
  display: flex;
  gap: 8px;
}

.qv-cell {
  flex: 1;
  height: 120px;
  border-radius: 2px;
  overflow: hidden;
}

.qv-cell.tall { height: 252px; }

/* ── PROGRAM ── */

.program-section {
  padding: 96px 0 80px;
  background: var(--warm-white);
}

.program-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
  margin-bottom: 56px;
}

.program-head h2 {
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 300;
  line-height: 1.1;
  color: var(--teal);
  letter-spacing: -.02em;
}

.program-head p {
  font-size: 13px;
  line-height: 1.75;
  color: var(--muted);
  margin-bottom: 20px;
}

.program-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 220px);
  gap: 10px;
}

.prog-card {
  position: relative;
  overflow: hidden;
  border-radius: 3px;
  color: #fff;
  isolation: isolate;
  cursor: pointer;
}

.prog-card:first-child {
  grid-row: 1 / 3;
}

.prog-card img {
  position: absolute;
  inset: 0;
  transition: transform .5s ease;
}

.prog-card:hover img { transform: scale(1.06); }

.prog-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(5,25,21,.85) 0%, rgba(5,25,21,.1) 70%);
  z-index: 1;
}

.prog-info {
  position: absolute;
  inset: auto 18px 18px;
  z-index: 2;
}

.prog-tag {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid rgba(232,222,200,.4);
  border-radius: 2px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--sand);
  margin-bottom: 8px;
}

.prog-info h3 {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 400;
  line-height: 1.2;
}

/* ── BERITA ── */

.news-section {
  padding: 80px 0;
  background: var(--sand-pale);
}

.news-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 40px;
}

.news-head h2 {
  font-family: var(--serif);
  font-size: clamp(26px, 2.5vw, 38px);
  font-weight: 300;
  color: var(--teal);
}

.see-all {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--green);
  white-space: nowrap;
  transition: opacity .2s;
}

.see-all:hover { opacity: .7; }

.news-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.news-card {
  background: #fff;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.06);
  transition: transform .25s, box-shadow .25s;
}

.news-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(10,46,40,.1);
}

.news-img {
  height: 160px;
  overflow: hidden;
}

.news-img img {
  transition: transform .5s;
}

.news-card:hover .news-img img { transform: scale(1.05); }

.news-body {
  padding: 18px;
}

.news-tag {
  display: inline-block;
  padding: 3px 8px;
  background: var(--green-pale);
  color: var(--teal);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  border-radius: 2px;
  margin-bottom: 10px;
}

.news-date {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}

.news-body h3 {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--teal);
  margin-bottom: 12px;
}

.news-read {
  font-size: 11px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: .06em;
}

/* ── JOIN BANNER ── */

.join-section {
  position: relative;
  min-height: 400px;
  display: flex;
  align-items: center;
  color: #fff;
  isolation: isolate;
  overflow: hidden;
}

.join-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
}

.join-section::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg, rgba(5,24,20,.92) 0%, rgba(5,24,20,.6) 60%, rgba(5,24,20,.2) 100%);
}

.join-inner {
  padding: 80px 0;
}

.join-kicker {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--sand);
  opacity: .8;
  margin-bottom: 16px;
}

.join-inner h2 {
  font-family: var(--serif);
  font-size: clamp(32px, 4vw, 56px);
  font-weight: 300;
  line-height: 1.05;
  max-width: 640px;
  margin-bottom: 20px;
  letter-spacing: -.02em;
}

.join-inner p {
  font-size: 14px;
  line-height: 1.7;
  color: rgba(255,255,255,.72);
  max-width: 420px;
  margin-bottom: 32px;
}

.join-actions { display: flex; flex-wrap: wrap; gap: 14px; }

/* ── FOOTER ── */

footer {
  background: var(--teal);
  color: rgba(255,255,255,.7);
}

.footer-top {
  padding: 64px 0 48px;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 48px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.footer-brand-block .brand-symbol {
  font-size: 40px;
  display: block;
  margin-bottom: 8px;
}

.footer-brand-block .brand-name {
  font-size: 14px;
  margin-bottom: 16px;
  display: block;
}

.footer-brand-block p {
  font-size: 12px;
  line-height: 1.7;
  color: rgba(255,255,255,.5);
  max-width: 240px;
}

.footer-col h4 {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--sand);
  opacity: .75;
  margin-bottom: 20px;
}

.footer-col ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.footer-col ul a {
  font-size: 13px;
  color: rgba(255,255,255,.55);
  transition: color .2s;
}

.footer-col ul a:hover { color: var(--sand); }

.footer-contact-info { display: flex; flex-direction: column; gap: 10px; }
.footer-contact-info span,
.footer-contact-info a {
  font-size: 12px;
  color: rgba(255,255,255,.55);
  transition: color .2s;
}
.footer-contact-info a:hover { color: var(--sand); }

.footer-bottom {
  padding: 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.footer-copy { font-size: 11px; color: rgba(255,255,255,.35); }

.footer-socials {
  display: flex;
  gap: 12px;
}

.social-dot {
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: rgba(255,255,255,.5);
  transition: border-color .2s, color .2s;
}

.social-dot:hover { border-color: var(--sand); color: var(--sand); }

/* ── MOBILE MENU ── */

.mobile-menu {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99;
  background: rgba(5,24,20,.97);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.mobile-menu.open { display: flex; }

.mobile-menu a {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 300;
  color: rgba(255,255,255,.85);
  padding: 14px 40px;
  letter-spacing: -.01em;
  transition: color .2s;
}

.mobile-menu a:hover { color: var(--sand); }

.mobile-close {
  position: absolute;
  top: 20px;
  right: 24px;
  background: none;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 2px;
  color: #fff;
  font-size: 20px;
  line-height: 1;
  padding: 8px 12px;
  cursor: pointer;
}

/* ── RESPONSIVE ── */

@media (max-width: 1024px) {
  .wrap { width: calc(100% - 48px); }

  .footer-top {
    grid-template-columns: 1fr 1fr;
    gap: 36px;
  }
}

@media (max-width: 768px) {
  .wrap { width: calc(100% - 32px); }

  .nav-links, .nav-btn { display: none; }
  .hamburger { display: block; }

  .hero h1 { font-size: clamp(40px, 10vw, 64px); }
  .hero-stats { gap: 24px; }
  .stat-num { font-size: 22px; }

  .about-grid { grid-template-columns: 1fr; gap: 40px; }
  .about-photo-accent { display: none; }
  .about-photo-main { height: 300px; }
  .about-badge { top: auto; right: 16px; bottom: 16px; }

  .pillar-list { grid-template-columns: 1fr 1fr; }

  .quote-inner { grid-template-columns: 1fr; }

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <button class="mobile-close" id="mobileClose" aria-label="Tutup menu">✕</button>
  <a href="#tentang">Tentang</a>
  <a href="#pilar">Pilar</a>
  <a href="#program">Program</a>

<div id="app"></div>
<noscript>Aktifkan JavaScript untuk melihat website ini.</noscript>
<script src="site.js"></script>

<script>
  // Navbar scroll effect
  const navBar = document.getElementById('navBar');
  window.addEventListener('scroll', () => {
    navBar.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });

  // Mobile menu
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  const mobileClose = document.getElementById('mobileClose');

  function openMenu() {
    mobileMenu.classList.add('open');
    mobileMenu.setAttribute('aria-hidden', 'false');
    hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    mobileMenu.classList.remove('open');
    mobileMenu.setAttribute('aria-hidden', 'true');
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  hamburger.addEventListener('click', openMenu);
  mobileClose.addEventListener('click', closeMenu);
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

  // Keyboard close
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMenu();
  });
</script>
