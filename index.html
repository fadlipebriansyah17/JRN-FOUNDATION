01Tentang JRNSiapa Kami


Menjaga alam.
Menguatkan masyarakat.
Melestarikan Nusantara.
JRN Foundation adalah organisasi nirlaba Indonesia yang bergerak di bidang konservasi lingkungan, pemberdayaan masyarakat, dan perlindungan keanekaragaman hayati.
Kami percaya bahwa alam, manusia, dan budaya adalah satu kesatuan yang saling menghidupi. Karena itu, kami hadir bukan hanya untuk merawat hutan dan laut, tetapi juga untuk memperkuat komunitas lokal dan melestarikan tradisi seni budaya Nusantara.
Selengkapnya tentang kami




2012Berdiri sejak



02Fokus KerjaEmpat Pilar Gerakan
Seluruh kerja JRN Foundation bertumpu pada empat pilar utama yang saling berhubungan — karena alam yang sehat membutuhkan masyarakat yang berdaya, budaya yang hidup, dan advokasi yang kuat.

/ 01🌿Konservasi AlamRestorasi hutan kritis, perlindungan satwa endemik, penanaman pohon, dan edukasi ekosistem di seluruh Nusantara.
/ 02🤝Pemberdayaan MasyarakatEkonomi lokal berkelanjutan, pelatihan keterampilan warga desa, dan kemandirian pangan berbasis kearifan lokal.
/ 03🎭Pelestarian BudayaDokumentasi tradisi lisan, revitalisasi seni pertunjukan daerah, dan ruang kreasi bagi generasi muda adat.
/ 04📢Edukasi & AdvokasiRiset kebijakan lingkungan, kampanye kesadaran publik, dan kolaborasi lintas sektor untuk masa depan lestari.


"Merawat hutan dan laut Nusantara berarti merawat napas kehidupan bagi anak cucu kita di masa depan."— Jaga Raya Nusantara Foundation
03Aksi NyataProgram Unggulan
Bergerak bersama komunitas dari hulu hingga hilir.Setiap program dirancang bersama masyarakat setempat agar memberikan dampak jangka panjang bagi ekosistem dan kesejahteraan warga.
